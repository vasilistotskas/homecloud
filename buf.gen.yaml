# Code generation for the API contract. Plugins run locally at the versions
# pinned in go.mod (tool directives), so generation needs no network access.
version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/vasilistotskas/homecloud/gen
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen
    opt: paths=source_relative
inputs:
  - directory: proto
