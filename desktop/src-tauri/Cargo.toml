[package]
name = "homecloud-desktop"
version = "0.1.0"
description = "Desktop app for the homecloud agent"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "homecloud_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-log = "=2.10.0"
# The credential store API and one store per platform, as the keyring
# ecosystem asks applications to link it (the `keyring` crate is its demo).
keyring-core = "=1.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "=1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
