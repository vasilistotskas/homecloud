[package]
name = "homecloud-desktop"
version = "0.1.0"
description = "Desktop app for the homecloud agent"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "homecloud_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-log = "=2.10.0"
keyring = "=4.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
log = "=0.4.34"

[profile.release]
codegen-units = 1
lto = true
strip = true
