version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - sqlclosecheck
    - rowserrcheck
    - unconvert
    - unparam
    - wrapcheck
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    wrapcheck:
      # Errors from this module's own packages already carry context at their source.
      ignore-package-globs:
        - github.com/vasilistotskas/homecloud/*
    govet:
      enable-all: true
      disable:
        - fieldalignment
  exclusions:
    rules:
      # Tests assert on errors directly; wrapping them adds no context.
      - path: _test\.go
        linters:
          - wrapcheck

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/vasilistotskas/homecloud
