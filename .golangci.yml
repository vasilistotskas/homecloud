version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - sqlclosecheck
    - rowserrcheck
    - sloglint
    - unconvert
    - unparam
    - wrapcheck
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: ^exec\.Command(Context)?$
          pkg: ^os/exec$
          msg: start programs with platform.Command, which runs them without a console window on Windows
      analyze-types: true
    sloglint:
      # One shape for every log line: a constant lowercase message with
      # snake_case keys, and the context wherever there is one, so a line
      # logged during a run names it (package logging).
      no-global: all
      context: scope
      static-msg: true
      msg-style: lowercased
      kv-only: true
      key-naming-case: snake
      forbidden-keys:
        - time
        - level
        - msg
        - source
    wrapcheck:
      # Errors from this module's own packages already carry context at their source.
      ignore-package-globs:
        - github.com/vasilistotskas/homecloud/*
      # These create the API's error from our own message (and keep the cause
      # for the server); there is no external error to wrap (wrapcheck 2.13
      # reports *connect.Error).
      extra-ignore-sigs:
        - connectrpc.com/connect/v2.NewError(
        - connectrpc.com/connect/v2.Errorf(
        - (*connectrpc.com/connect/v2.Error).WithCause(
    govet:
      enable-all: true
      disable:
        - fieldalignment
  exclusions:
    rules:
      # Tests assert on errors directly; wrapping them adds no context.
      - path: _test\.go
        linters:
          - wrapcheck
      # platform.Command is the one place that may call os/exec directly.
      - path: internal/platform/command\.go
        linters:
          - forbidigo

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/vasilistotskas/homecloud
