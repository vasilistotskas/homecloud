# homecloud on a NAS: the agent next to its files, used from your own devices
# at https://<TS_HOSTNAME>.<your tailnet>.ts.net through Tailscale. The agent
# listens on 127.0.0.1 inside the shared network namespace; nothing is
# published on the LAN.
#
#   cp homecloud.env.example .env   # then fill it in
#   docker compose up -d
#   docker compose exec homecloud homecloud open --print
#
# Set web.public_origin = "https://<TS_HOSTNAME>.<your tailnet>.ts.net" and
# smartctl.socket = '/run/homecloud-smartctl/smartctl.sock' in config.toml.
# The tailnet needs MagicDNS and HTTPS certificates enabled.
#
# The node joins the tailnet as tag:homecloud. Before the first start, let
# your tailnet's admins own that tag and give your devices port 443 of it
# alone (README, "On a NAS"): in userspace networking Tailscale hands a
# tailnet connection to any port of the node to 127.0.0.1 at that port, so
# without the policy your devices could also reach the agent's plain-HTTP
# port, where requests still need a sign-in.

services:
  tailscale:
    image: tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
    hostname: ${TS_HOSTNAME}
    environment:
      # Needed only until the node is registered; its identity is then kept
      # in TS_STATE_DIR.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /serve/serve.json
      # Userspace networking needs no kernel device or extra capabilities.
      TS_USERSPACE: "true"
      # A tagged node, so the tailnet policy can allow exactly port 443 of it.
      TS_EXTRA_ARGS: --advertise-tags=tag:homecloud
    volumes:
      - ${HOMECLOUD_DATA}/tailscale:/var/lib/tailscale
      - ./serve.json:/serve/serve.json:ro
    restart: unless-stopped

  # The agent parses media downloaded from iCloud, so it gets nothing it does
  # not need: no capabilities, no devices, a read-only system. Drive health
  # comes from the smartctl sidecar below.
  homecloud:
    image: ${HOMECLOUD_IMAGE}
    network_mode: service:tailscale
    user: "${PUID}:${PGID}"
    environment:
      # Times the CLI prints (a sign-in code's expiry) are local times.
      TZ: ${TZ}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    volumes:
      - ${HOMECLOUD_ARCHIVE}:/archive
      - ${HOMECLOUD_DATA}/config:/config:ro
      - ${HOMECLOUD_DATA}/state:/state
      - ${HOMECLOUD_BACKUPS}:/backups
      - ${HOMECLOUD_IPHONE_INCOMING}:/iphone
      - smartctl:/run/homecloud-smartctl
    depends_on:
      - tailscale
      - smartctl
    restart: unless-stopped

  # Drive health (drive_health.source = "smartctl"): the only container with
  # the drives and the capabilities that query them, and no network. It
  # answers the agent on a socket in the shared smartctl volume. Pass every
  # drive holding the archive, read-only, by its stable /dev/disk/by-id/ name.
  # smartctl in the image carries the capabilities as file capabilities, so
  # they are allowed here and no-new-privileges is not set.
  smartctl:
    image: ${HOMECLOUD_IMAGE}
    entrypoint: ["homecloud", "smartctl", "serve"]
    network_mode: none
    user: "${PUID}:${PGID}"
    cap_drop:
      - ALL
    cap_add:
      - SYS_RAWIO # ATA SMART commands
      - SYS_ADMIN # NVMe admin commands
      - DAC_OVERRIDE # open the drives' nodes, root's alone
    read_only: true
    devices:
      - ${HOMECLOUD_DRIVE_1}:${HOMECLOUD_DRIVE_1}:r
      - ${HOMECLOUD_DRIVE_2}:${HOMECLOUD_DRIVE_2}:r
    volumes:
      - ${HOMECLOUD_DATA}/config:/config:ro
      - smartctl:/run/homecloud-smartctl
    restart: unless-stopped

volumes:
  # The sidecar's socket: in memory, the NAS user's alone.
  smartctl:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=${PUID},gid=${PGID},mode=0700
