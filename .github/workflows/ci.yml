name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint
        run: go tool buf lint
      - name: Generated code is current
        run: |
          go tool buf generate
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - name: No breaking changes
        env:
          # Pull requests compare with their base branch, pushes with the previous commit.
          AGAINST: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          if git cat-file -e "$AGAINST:proto" 2>/dev/null; then
            go tool buf breaking --against ".git#ref=$AGAINST"
          else
            echo "$AGAINST has no API contract yet; nothing to compare against."
          fi

  check:
    needs: proto
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
      - uses: golang/govulncheck-action@v1.1.0
        with:
          # The action defaults go-version-input to "stable", which overrides
          # go-version-file; clear it so govulncheck uses the go.mod toolchain.
          go-version-input: ""
          go-version-file: go.mod
          repo-checkout: false
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          go build -trimpath -o bin/homecloud.exe ./cmd/homecloud
          go build -trimpath -ldflags=-H=windowsgui -o bin/homecloud-agent.exe ./cmd/homecloud-agent
      - name: Build (Linux amd64 + arm64)
        if: runner.os == 'Linux'
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath -o bin/linux-$arch/homecloud ./cmd/homecloud
            GOARCH=$arch go build -trimpath -o bin/linux-$arch/homecloud-agent ./cmd/homecloud-agent
          done
