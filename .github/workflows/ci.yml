name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes an older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI minutes are limited: each job runs only when something it checks
  # changed. A change to this workflow runs everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      proto: ${{ steps.filter.outputs.proto }}
      desktop: ${{ steps.filter.outputs.desktop }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      # The whole history: the filter then finds the commit before a push
      # locally and never fetches, which would need the job's credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/ci.yml'
            proto:
              - *workflow
              - 'proto/**'
              - 'buf.yaml'
              - 'buf.gen.yaml'
              - 'gen/**'
              - 'ui/src/gen/**'
              - 'ui/package.json'
              - 'ui/pnpm-lock.yaml'
            web:
              - *workflow
              - 'ui/**'
            go:
              - *workflow
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'internal/**'
              - 'gen/**'
              # The Go build embeds the web app (ui/embed.go).
              - 'ui/**'
            desktop:
              - *workflow
              - 'desktop/**'
              # The shell packages the built web app.
              - 'ui/**'
            # The image recipe and its toolchain pins; the code inside it is
            # checked by the go and web jobs.
            image:
              - *workflow
              - 'Dockerfile'
              - '.dockerignore'
              - 'go.mod'
              - 'ui/package.json'
              - 'ui/pnpm-lock.yaml'

  web:
    needs: changes
    # Also builds the app that the Go and desktop jobs embed.
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Known vulnerabilities in the web app's dependencies, as govulncheck
      # checks the Go side (Dependabot does not cover pnpm 12).
      - name: Audit
        run: pnpm audit --audit-level low
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      # The Go build embeds the web app (ui/embed.go), so later jobs need it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error

  proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # protoc-gen-es is pinned in ui/package.json.
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: Lint
        run: go tool buf lint
      - name: Generated code is current
        run: |
          go tool buf generate
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - name: No breaking changes
        env:
          # Pull requests compare with their base branch, pushes with the previous commit.
          AGAINST: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        # Each API version must stay compatible with itself; an incompatible
        # change gets a new version (homecloud.agent.vN), which has nothing to
        # be compared with yet (docs/design.md, Local API).
        run: |
          for dir in proto/homecloud/agent/*/; do
            dir="${dir%/}"
            if git cat-file -e "$AGAINST:$dir" 2>/dev/null; then
              go tool buf breaking --against ".git#ref=$AGAINST" --path "$dir"
            else
              echo "$dir is a new API version; $AGAINST has nothing to compare it with."
            fi
          done

  check:
    needs: [changes, web, proto]
    # proto may be skipped; check needs only web's artifact and a passing contract.
    if: always() && needs.changes.outputs.go == 'true' && needs.web.result == 'success' && needs.proto.result != 'failure' && needs.proto.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/dist
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Storage discovery on real block devices
        if: runner.os == 'Linux'
        # md raid1 → LVM → ext4 and a btrfs raid1 on loop devices, as on a NAS
        # pool (internal/platform TestStorageOfRealStack); it needs root.
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mdadm lvm2 btrfs-progs
          sudo modprobe raid1
          sudo modprobe btrfs
          go test -c -o "$RUNNER_TEMP/platform.test" ./internal/platform/
          sudo HOMECLOUD_TEST_BLOCK_DEVICES=1 "$RUNNER_TEMP/platform.test" -test.run TestStorageOfRealStack -test.v
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # The action defaults go-version-input to "stable", which overrides
          # go-version-file; clear it so govulncheck uses the go.mod toolchain.
          go-version-input: ""
          go-version-file: go.mod
          repo-checkout: false
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          go build -trimpath -o bin/homecloud.exe ./cmd/homecloud
          go build -trimpath -ldflags=-H=windowsgui -o bin/homecloud-agent.exe ./cmd/homecloud-agent
      - name: Build (Linux amd64 + arm64)
        if: runner.os == 'Linux'
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath -o bin/linux-$arch/homecloud ./cmd/homecloud
            GOARCH=$arch go build -trimpath -o bin/linux-$arch/homecloud-agent ./cmd/homecloud-agent
          done

  desktop:
    needs: [changes, web]
    if: always() && needs.changes.outputs.desktop == 'true' && needs.web.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-24.04
            bundles: deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The shell packages the built web app (build.frontendDist).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/dist
      - name: Linux build dependencies (Tauri prerequisites)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # rustup installs the toolchain pinned in src-tauri/rust-toolchain.toml.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
      - name: Format
        working-directory: desktop/src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - name: Build
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The arm64 runtime stage runs apt under emulation; everything else is
      # cross-compiled on the runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/amd64 and linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=${{ github.sha }}
