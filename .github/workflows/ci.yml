name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes an older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      # The Go build embeds the web app (ui/embed.go), so later jobs need it.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # protoc-gen-es is pinned in ui/package.json.
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: Lint
        run: go tool buf lint
      - name: Generated code is current
        run: |
          go tool buf generate
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - name: No breaking changes
        env:
          # Pull requests compare with their base branch, pushes with the previous commit.
          AGAINST: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          if git cat-file -e "$AGAINST:proto" 2>/dev/null; then
            go tool buf breaking --against ".git#ref=$AGAINST"
          else
            echo "$AGAINST has no API contract yet; nothing to compare against."
          fi

  check:
    needs: [web, proto]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ui-dist
          path: ui/dist
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
      - uses: golang/govulncheck-action@v1.1.0
        with:
          # The action defaults go-version-input to "stable", which overrides
          # go-version-file; clear it so govulncheck uses the go.mod toolchain.
          go-version-input: ""
          go-version-file: go.mod
          repo-checkout: false
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          go build -trimpath -o bin/homecloud.exe ./cmd/homecloud
          go build -trimpath -ldflags=-H=windowsgui -o bin/homecloud-agent.exe ./cmd/homecloud-agent
      - name: Build (Linux amd64 + arm64)
        if: runner.os == 'Linux'
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath -o bin/linux-$arch/homecloud ./cmd/homecloud
            GOARCH=$arch go build -trimpath -o bin/linux-$arch/homecloud-agent ./cmd/homecloud-agent
          done

  desktop:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-24.04
            bundles: deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7.0.1
      # The shell packages the built web app (build.frontendDist).
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ui-dist
          path: ui/dist
      - name: Linux build dependencies (Tauri prerequisites)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # rustup installs the toolchain pinned in src-tauri/rust-toolchain.toml.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop/src-tauri
      - name: Format
        working-directory: desktop/src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
