syntax = "proto3";

// Package homecloud.agent.v3 is the local API of the homecloud agent. It is
// served on the loopback address configured as web.listen. Clients
// authenticate with the bearer token from the agent's discovery file, or (in a
// browser) with a session cookie obtained through a one-time login code.
package homecloud.agent.v3;

import "google/protobuf/timestamp.proto";

// AgentService exposes the agent's state and the operator actions it accepts.
service AgentService {
  // GetInfo identifies the agent. Incompatible API changes get a new proto
  // package (homecloud.agent.v3), so an outdated client fails with
  // Unimplemented; api_version is informational, for display and support.
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetOverview returns the current archive overview.
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // WatchOverview sends the current overview, then a new one whenever it changes.
  rpc WatchOverview(WatchOverviewRequest) returns (stream WatchOverviewResponse);
  // ListRuns pages through recorded runs, newest first.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListEvents pages through the append-only audit log, newest first.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListAssets pages through the archive, newest first, for the library browser.
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListQuarantine lists quarantined assets with their failing renditions.
  rpc ListQuarantine(ListQuarantineRequest) returns (ListQuarantineResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetAsset returns one asset with every rendition and its verification evidence.
  rpc GetAsset(GetAssetRequest) returns (GetAssetResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ReleaseQuarantine returns a quarantined asset to verification. The reason
  // is required and recorded in the audit log.
  rpc ReleaseQuarantine(ReleaseQuarantineRequest) returns (ReleaseQuarantineResponse);
  // StartSync asks the agent to run a cycle now.
  rpc StartSync(StartSyncRequest) returns (StartSyncResponse);
  // SendTestNotification sends a test alert through the configured channel.
  rpc SendTestNotification(SendTestNotificationRequest) returns (SendTestNotificationResponse);
  // GetSettings returns the agent's effective configuration.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // CreateLoginCode issues a short-lived, single-use code that a browser can
  // exchange for a session, or a device can pair with. Requires the agent
  // token.
  rpc CreateLoginCode(CreateLoginCodeRequest) returns (CreateLoginCodeResponse);
  // ExchangeLoginCode trades a login code for a session cookie. Callable
  // without credentials: the code is the credential.
  rpc ExchangeLoginCode(ExchangeLoginCodeRequest) returns (ExchangeLoginCodeResponse);
  // PairDevice trades a login code for a device token, which the device
  // keeps and sends as its bearer token until it is revoked. Callable without
  // credentials: the code is the credential.
  rpc PairDevice(PairDeviceRequest) returns (PairDeviceResponse);
  // ListDevices lists the paired devices that are not revoked.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // RevokeDevice ends a paired device's access at once.
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
}

message GetInfoRequest {}

message GetInfoResponse {
  // Build version of the agent, e.g. a git revision.
  string agent_version = 1;
  // Semantic version of this API, "MAJOR.MINOR".
  string api_version = 2;
  // Operating system the agent runs on, as Go's GOOS (e.g. "windows", "linux").
  string os = 3;
}

message GetOverviewRequest {}

message GetOverviewResponse {
  Overview overview = 1;
}

message WatchOverviewRequest {}

message WatchOverviewResponse {
  Overview overview = 1;
}

// Overview is the archive at a glance.
message Overview {
  AssetCounts assets = 1;
  ArchiveTotals archive = 2;
  Storage storage = 3;
  AppleAccount apple_account = 4;
  Activity activity = 5;
  // The most recent finished cycle; absent before the first one finishes.
  Run last_cycle = 6;
  // The latest health check of the storage holding the archive; absent
  // before the first one.
  StorageHealth storage_health = 7;
  // The most recent finished scrub; absent before the first one.
  Run last_scrub = 8;
  // The most recent finished ledger backup; absent before the first one.
  Run last_ledger_backup = 9;
  // The most recent finished check of the local iPhone backups; absent before
  // the first one.
  Run last_iphone_backup = 10;
  // The most recent finished iCloud Drive sync; absent before the first one.
  Run last_drive_sync = 11;
  // The iCloud Drive archive under <storage.root>/Drive.
  ICloudDrive icloud_drive = 12;
}

// ICloudDrive is the iCloud Drive archive and homecloud's iCloud session.
message ICloudDrive {
  // Archived files, including those deleted in iCloud since.
  int64 files = 1;
  int64 bytes = 2;
  // Archived files no longer in iCloud; their copies are kept.
  int64 deleted_in_icloud = 3;
  // When the owner last signed homecloud in to iCloud; absent if never.
  google.protobuf.Timestamp signed_in_at = 4;
  // Set when the saved session cannot be read; signing in again replaces it.
  string session_problem = 5;
}

// StorageHealth is the health of the storage holding the archive: every
// drive under it and, on Linux, the md software RAID arrays between those
// drives and the file system, with the agent's verdicts.
message StorageHealth {
  // The worst state of any drive or array; a problem one reports outranks
  // one that could not be read.
  HealthState state = 1;
  google.protobuf.Timestamp checked_at = 2;
  // Why the state is not OK, each prefixed with its drive or array, or why
  // the storage could not be found.
  repeated string reasons = 3;
  // Sorted by name.
  repeated DriveHealth drives = 4;
  // Sorted by name.
  repeated RaidArray arrays = 5;
}

// DriveHealth is what one drive reports about itself (SMART) and the agent's
// verdict on it.
message DriveHealth {
  // The operating system's name for the drive: "sda", "nvme0n1",
  // "PhysicalDrive1".
  string name = 1;
  HealthState state = 2;
  // Why the state is not OK, or why health could not be read.
  repeated string reasons = 3;
  string model = 4;
  // Identifies the physical drive, e.g. to find the one to replace.
  string serial = 5;
  // "NVMe" or "ATA"; empty when health could not be read.
  string protocol = 6;
  // The drive's own critical warnings, e.g. "spare", "temperature", "failing".
  repeated string warnings = 7;
  optional int32 temperature_celsius = 8;
  // Endurance estimate; 100 means the rated life is used up.
  optional int32 percent_used = 9;
  optional int32 available_spare_percent = 10;
  // NVMe media and data-integrity errors, or ATA bad sectors.
  optional uint64 media_errors = 11;
  optional uint64 power_on_hours = 12;
}

// RaidArray is a Linux md array, as the kernel reports it.
message RaidArray {
  // "md1".
  string name = 1;
  HealthState state = 2;
  // Why the state is not OK.
  repeated string reasons = 3;
  // "raid1".
  string level = 4;
  // md's array_state: "clean", "active", "inactive", …
  string array_state = 5;
  // Members of the complete array.
  int32 raid_disks = 6;
  // Members the array is missing.
  int32 degraded = 7;
  // idle, resync, recover, check, repair, reshape or frozen; empty for
  // arrays without redundancy.
  string sync_action = 8;
  // Sectors done and in total of the running sync action; 0 when none runs.
  uint64 sync_done = 9;
  uint64 sync_total = 10;
  // What the last check found; on raid1 not a sign of damage by itself.
  uint64 mismatch_count = 11;
  // Sorted by name.
  repeated RaidMember members = 12;
}

// RaidMember is one device of an md array.
message RaidMember {
  // "sda3".
  string name = 1;
  // The drive it is on: "sda".
  string drive = 2;
  // md's flags for it: in_sync, faulty, spare, write_error, …
  repeated string states = 3;
  // Read errors the array corrected without evicting the device.
  uint64 read_errors = 4;
}

// HealthState is a verdict on a drive, an array or all of the archive's storage.
enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  HEALTH_STATE_OK = 1;
  // Data was lost or remapped, the rated endurance is used up, or an array
  // is rebuilding or has a member with errors.
  HEALTH_STATE_WARNING = 2;
  // A drive predicts its own failure, or an array lost its redundancy.
  HEALTH_STATE_FAILING = 3;
  // Health could not be read; never treated as healthy.
  HEALTH_STATE_UNAVAILABLE = 4;
}

// AssetCounts counts assets by lifecycle state.
message AssetCounts {
  int64 discovered = 1;
  int64 downloaded = 2;
  int64 verified = 3;
  int64 quarantined = 4;
}

// ArchiveTotals sums the downloaded renditions on disk.
message ArchiveTotals {
  int64 files = 1;
  int64 bytes = 2;
}

// Storage describes the volume holding the archive.
message Storage {
  string root = 1;
  int64 total_bytes = 2;
  int64 free_bytes = 3;
  // Configured minimum free space, in percent of total_bytes.
  double min_free_percent = 4;
}

// AppleAccount reports whether the downloader could use the Apple session in
// the most recent cycle.
message AppleAccount {
  AppleAccountState state = 1;
}

enum AppleAccountState {
  // No cycle has reported on the account yet.
  APPLE_ACCOUNT_STATE_UNSPECIFIED = 0;
  APPLE_ACCOUNT_STATE_SIGNED_IN = 1;
  // The session expired; the operator must sign in again (kei exit 3).
  APPLE_ACCOUNT_STATE_SIGN_IN_REQUIRED = 2;
  // Apple reported an account state that needs the operator (kei exit 4).
  APPLE_ACCOUNT_STATE_NEEDS_ATTENTION = 3;
}

// Activity is what the agent is doing now.
message Activity {
  Phase phase = 1;
  // When the current phase started; absent while idle.
  google.protobuf.Timestamp phase_started_at = 2;
  // When the next scheduled cycle starts.
  google.protobuf.Timestamp next_cycle_at = 3;
  // When each maintenance job runs next: after the first cycle at or after
  // it is due. All absent while a cycle runs.
  google.protobuf.Timestamp next_scrub_at = 4;
  google.protobuf.Timestamp next_ledger_backup_at = 5;
  google.protobuf.Timestamp next_iphone_backup_check_at = 6;
  google.protobuf.Timestamp next_drive_sync_at = 7;
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_IDLE = 1;
  PHASE_DOWNLOADING = 2;
  PHASE_INGESTING = 3;
  PHASE_VERIFYING = 4;
  // Rendering thumbnails of new files for the library browser.
  PHASE_PREPARING_PREVIEWS = 5;
  // Re-hashing a share of archived files against their download checksums.
  PHASE_CHECKING_ARCHIVE = 6;
  // Writing a checked snapshot of the ledger to the backup directory.
  PHASE_BACKING_UP_LEDGER = 7;
  // Inspecting the local iPhone backups.
  PHASE_CHECKING_IPHONE_BACKUPS = 8;
  // Archiving new and changed iCloud Drive files.
  PHASE_SYNCING_DRIVE = 9;
}

// Run is one recorded job execution.
message Run {
  int64 id = 1;
  string kind = 2;
  google.protobuf.Timestamp started_at = 3;
  // Absent while the run is in progress.
  google.protobuf.Timestamp finished_at = 4;
  RunResult result = 5;
  // Present for kind "cycle" once finished.
  CycleReport cycle = 6;
  // Present for kind "scrub" once finished.
  ScrubReport scrub = 7;
  // Present for kind "ledger_backup" once finished.
  LedgerBackupReport ledger_backup = 8;
  // Present for kind "iphone_backup" once finished.
  IPhoneBackupReport iphone_backup = 9;
  // Present for kind "drive_sync" once finished.
  DriveSyncReport drive_sync = 10;
}

// RunKind selects one kind of recorded job.
enum RunKind {
  RUN_KIND_UNSPECIFIED = 0;
  // A sync cycle: download, ingest, verify (Run.kind "cycle").
  RUN_KIND_CYCLE = 1;
  // A re-check of archived files against their checksums (Run.kind "scrub").
  RUN_KIND_SCRUB = 2;
  // A snapshot of the ledger (Run.kind "ledger_backup").
  RUN_KIND_LEDGER_BACKUP = 3;
  // A check of the local iPhone backups (Run.kind "iphone_backup").
  RUN_KIND_IPHONE_BACKUP = 4;
  // An iCloud Drive sync (Run.kind "drive_sync").
  RUN_KIND_DRIVE_SYNC = 5;
}

// ScrubReport is what one re-check of archived files found.
message ScrubReport {
  // Verified files in the archive; each run checks a share of them.
  int64 eligible = 1;
  int64 checked = 2;
  int64 passed = 3;
  // Files that changed or vanished; their assets are quarantined.
  int64 mismatched = 4;
  // Files that could not be read this time; they are checked first next run.
  int64 errored = 5;
  // Set when the run could not check files at all.
  string error = 6;
  // The same re-check of archived iCloud Drive files.
  DriveScrub drive = 7;
}

// DriveScrub is a scrub's re-check of archived iCloud Drive files.
message DriveScrub {
  int64 eligible = 1;
  int64 checked = 2;
  int64 passed = 3;
  // Copies that no longer match; the next Drive sync downloads them again.
  int64 damaged = 4;
  int64 errored = 5;
}

// DriveSyncReport is what one iCloud Drive sync did. Archived files are never
// deleted: changed files keep their previous copies, deleted ones are recorded.
message DriveSyncReport {
  DriveSyncOutcome outcome = 1;
  // Files listed in iCloud.
  int64 listed = 2;
  // Files downloaded for the first time.
  int64 archived = 3;
  // Files whose bytes changed in iCloud; the previous copies were kept.
  int64 changed = 4;
  // Damaged copies replaced by a fresh download.
  int64 repaired = 5;
  // Files moved or renamed in iCloud.
  int64 moved = 6;
  // Files newly gone from iCloud; their copies are kept.
  int64 deleted = 7;
  // Files back in iCloud after a deletion.
  int64 restored = 8;
  int64 downloaded_bytes = 9;
  // Files that could not be archived this time; retried next sync.
  int64 failed = 10;
  repeated string failures = 11;
  // Files listed in Drive/manifest.csv.
  int64 manifest_rows = 12;
  // Set when the sync could not run.
  string error = 13;
  // App folders that could not be listed and hold nothing archived: apps
  // that keep no documents in iCloud Drive (Messages, Notes, ...).
  int64 unlisted_apps = 14;
}

enum DriveSyncOutcome {
  DRIVE_SYNC_OUTCOME_UNSPECIFIED = 0;
  DRIVE_SYNC_OUTCOME_OK = 1;
  // Some files failed and are retried next sync.
  DRIVE_SYNC_OUTCOME_PARTIAL = 2;
  // homecloud's iCloud session expired: run "homecloud icloud login".
  DRIVE_SYNC_OUTCOME_SIGN_IN_REQUIRED = 3;
  DRIVE_SYNC_OUTCOME_SKIPPED_LOW_SPACE = 4;
  DRIVE_SYNC_OUTCOME_ARCHIVE_UNAVAILABLE = 5;
  DRIVE_SYNC_OUTCOME_ERROR = 6;
}

// LedgerBackupReport is one snapshot of the ledger.
message LedgerBackupReport {
  // The snapshot file; empty when the backup failed.
  string path = 1;
  int64 size_bytes = 2;
  // Older snapshots removed beyond the configured number to keep.
  int64 pruned = 3;
  // Set when the backup failed.
  string error = 4;
}

// IPhoneBackupReport is what one check of the local iPhone backups found.
// homecloud only reads the backups that Apple's Devices app writes.
message IPhoneBackupReport {
  // Each device's current backup.
  repeated IPhoneBackup devices = 1;
  // Frozen copies archived in Apple's tool; reported, not judged.
  int64 archived = 2;
  // Set when the check failed.
  string error = 3;
  // Backup directories that could not be checked.
  repeated string dir_errors = 4;
  // Backups pushed from another computer that were refused this check, or
  // why iphone_backup.incoming could not be read.
  repeated string push_errors = 5;
}

// IPhoneBackup is one device's current local backup and its verdict.
message IPhoneBackup {
  string udid = 1;
  string name = 2;
  // The device's iOS version.
  string product_version = 3;
  // The backup folder.
  string dir = 4;
  bool encrypted = 5;
  // When the last backup finished; absent if it never did.
  google.protobuf.Timestamp completed_at = 6;
  int64 files = 7;
  int64 size_bytes = 8;
  IPhoneBackupState state = 9;
  // Every problem found; empty when the backup is healthy.
  repeated string reasons = 10;
  // When every file was last read in full (iphone_backup.read_interval).
  google.protobuf.Timestamp last_full_read_at = 11;
  // Set when the device's backups arrive from another computer
  // (iphone_backup.incoming): the verdict is on its newest copy.
  bool from_copy = 12;
  // The device's copies in the archive (iphone_backup.keep), newest first.
  repeated IPhoneBackupCopy copies = 13;
  // Why the current backup could not be copied into the archive.
  string copy_error = 14;
}

// IPhoneBackupCopy is one copy of a device's backup kept in the archive.
message IPhoneBackupCopy {
  // When the copied backup finished.
  google.protobuf.Timestamp completed_at = 1;
  // The copy's folder: restore it by copying it into Apple's backup folder.
  string dir = 2;
  int64 files = 3;
  int64 size_bytes = 4;
  // Bytes written for this copy; it shares the rest with the copy before.
  int64 copied_bytes = 5;
  // When every file was last checked against the copy's manifest; absent
  // if never.
  google.protobuf.Timestamp verified_at = 6;
  // Files that no longer match the manifest.
  int64 damaged_files = 7;
}

// IPhoneBackupState values are ordered from healthy (OK) to most severe
// (INVALID); clients may rank by value. New values keep that order.
enum IPhoneBackupState {
  I_PHONE_BACKUP_STATE_UNSPECIFIED = 0;
  // Encrypted, finished, recent and readable.
  I_PHONE_BACKUP_STATE_OK = 1;
  // A backup is being written; judged once it finishes.
  I_PHONE_BACKUP_STATE_IN_PROGRESS = 2;
  // Much smaller than the last healthy backup.
  I_PHONE_BACKUP_STATE_SHRUNK = 3;
  // The last finished backup is older than the configured maximum age.
  I_PHONE_BACKUP_STATE_STALE = 4;
  // The last backup did not finish and none is running.
  I_PHONE_BACKUP_STATE_INCOMPLETE = 5;
  // Not encrypted: it lacks passwords and Health data, and the disk reveals it.
  I_PHONE_BACKUP_STATE_UNENCRYPTED = 6;
  // Some backed-up files could not be read from disk.
  I_PHONE_BACKUP_STATE_UNREADABLE = 7;
  // The folder is not a valid backup.
  I_PHONE_BACKUP_STATE_INVALID = 8;
}

enum RunResult {
  RUN_RESULT_UNSPECIFIED = 0;
  RUN_RESULT_RUNNING = 1;
  RUN_RESULT_OK = 2;
  RUN_RESULT_FAILED = 3;
}

// CycleReport is what one sync cycle did.
message CycleReport {
  DownloadOutcome download = 1;
  int64 assets = 2;
  int64 renditions = 3;
  int64 new_renditions = 4;
  int64 changed_renditions = 5;
  int64 checked = 6;
  int64 passed = 7;
  int64 mismatched = 8;
  int64 errored = 9;
  // Set when the cycle failed.
  string error = 10;
  // Renditions the downloader reported at a new local path; they are verified again.
  int64 moved_renditions = 11;
}

enum DownloadOutcome {
  DOWNLOAD_OUTCOME_UNSPECIFIED = 0;
  DOWNLOAD_OUTCOME_OK = 1;
  // Some assets failed and are retried next cycle.
  DOWNLOAD_OUTCOME_PARTIAL = 2;
  DOWNLOAD_OUTCOME_SIGN_IN_REQUIRED = 3;
  DOWNLOAD_OUTCOME_NEEDS_ATTENTION = 4;
  // The downloader could not be run or exited unexpectedly.
  DOWNLOAD_OUTCOME_ERROR = 5;
  // Not run: the archive drive is below its minimum free space.
  DOWNLOAD_OUTCOME_SKIPPED_LOW_SPACE = 6;
  // Not run: the configured archive drive was missing or replaced; nothing
  // else ran in that cycle either.
  DOWNLOAD_OUTCOME_ARCHIVE_UNAVAILABLE = 7;
  // The agent stopped before the cycle finished (e.g. Windows logoff).
  DOWNLOAD_OUTCOME_INTERRUPTED = 8;
}

message ListRunsRequest {
  // Maximum runs to return, at most 200; 0 selects the default of 50.
  int32 page_size = 1;
  // From a previous response's next_page_token; empty for the first page.
  string page_token = 2;
  // Required: the kind of runs to list.
  RunKind kind = 3;
}

message ListRunsResponse {
  repeated Run runs = 1;
  // Empty when there are no more runs.
  string next_page_token = 2;
}

// Event is one entry of the audit log.
message Event {
  int64 id = 1;
  google.protobuf.Timestamp at = 2;
  AssetRef asset = 3;
  oneof detail {
    RenditionChanged rendition_changed = 4;
    StateChanged state_changed = 5;
    Quarantined quarantined = 6;
    QuarantineReleased quarantine_released = 7;
    DriveHealthChanged drive_health_changed = 8;
    RenditionMoved rendition_moved = 9;
    IPhoneBackupChanged iphone_backup_changed = 10;
    DriveFileEvent drive_file = 11;
    IPhoneBackupCopyEvent iphone_backup_copy = 12;
  }
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_RENDITION_CHANGED = 1;
  EVENT_KIND_STATE_CHANGED = 2;
  EVENT_KIND_QUARANTINED = 3;
  EVENT_KIND_QUARANTINE_RELEASED = 4;
  EVENT_KIND_DRIVE_HEALTH_CHANGED = 5;
  EVENT_KIND_RENDITION_MOVED = 6;
  EVENT_KIND_IPHONE_BACKUP_CHANGED = 7;
  EVENT_KIND_DRIVE_FILE_ARCHIVED = 8;
  EVENT_KIND_DRIVE_FILE_CHANGED = 9;
  EVENT_KIND_DRIVE_FILE_MOVED = 10;
  EVENT_KIND_DRIVE_FILE_DELETED = 11;
  EVENT_KIND_DRIVE_FILE_RESTORED = 12;
  EVENT_KIND_DRIVE_FILE_DAMAGED = 13;
  EVENT_KIND_DRIVE_FILE_REPAIRED = 14;
  EVENT_KIND_IPHONE_BACKUP_COPIED = 15;
  EVENT_KIND_IPHONE_BACKUP_COPY_REMOVED = 16;
  EVENT_KIND_IPHONE_BACKUP_COPY_DAMAGED = 17;
  EVENT_KIND_IPHONE_BACKUP_PUSH_REFUSED = 18;
}

// IPhoneBackupCopyEvent is something that happened to a copy of an iPhone
// backup in the archive, or to a backup pushed from another computer.
message IPhoneBackupCopyEvent {
  IPhoneBackupCopyChange change = 1;
  string udid = 2;
  // Absent for a refused push.
  string device_name = 3;
  // When the backup finished.
  google.protobuf.Timestamp completed_at = 4;
  // COPIED: the backup's files; DAMAGED: the files that no longer match.
  int64 files = 5;
  // COPIED: the backup's size, and the bytes written for this copy.
  int64 size_bytes = 6;
  int64 copied_bytes = 7;
  // REMOVED: "retention" (beyond iphone_backup.keep) or "missing" (gone
  // from disk); PUSH_REFUSED: why.
  string reason = 8;
}

enum IPhoneBackupCopyChange {
  I_PHONE_BACKUP_COPY_CHANGE_UNSPECIFIED = 0;
  // A finished backup was copied into the archive.
  I_PHONE_BACKUP_COPY_CHANGE_COPIED = 1;
  // A copy left the archive.
  I_PHONE_BACKUP_COPY_CHANGE_REMOVED = 2;
  // Files of a copy no longer match its manifest (0: they do again).
  I_PHONE_BACKUP_COPY_CHANGE_DAMAGED = 3;
  // A pushed backup did not match its manifest and was dropped; the next
  // push sends it again.
  I_PHONE_BACKUP_COPY_CHANGE_PUSH_REFUSED = 4;
}

// DriveFileEvent is something that happened to an archived iCloud Drive file.
message DriveFileEvent {
  DriveFileChange change = 1;
  // The file's path in iCloud (for a move: where it is now).
  string path = 2;
  // For a move: where it was.
  string from_path = 3;
  // For a change: where the previous copy was kept, below the Drive folder.
  string kept_as = 4;
  // For damage: what the check found.
  string reason = 5;
  int64 size_bytes = 6;
  string sha256 = 7;
}

enum DriveFileChange {
  DRIVE_FILE_CHANGE_UNSPECIFIED = 0;
  // Archived for the first time.
  DRIVE_FILE_CHANGE_ARCHIVED = 1;
  // Its bytes changed in iCloud; the previous copy was kept.
  DRIVE_FILE_CHANGE_CHANGED = 2;
  // Moved or renamed in iCloud; the copy moved with it.
  DRIVE_FILE_CHANGE_MOVED = 3;
  // Gone from iCloud; the copy is kept.
  DRIVE_FILE_CHANGE_DELETED = 4;
  // Back in iCloud after a deletion.
  DRIVE_FILE_CHANGE_RESTORED = 5;
  // The copy no longer matched its checksum; downloaded again next sync.
  DRIVE_FILE_CHANGE_DAMAGED = 6;
  // A damaged or missing copy was replaced by a fresh download.
  DRIVE_FILE_CHANGE_REPAIRED = 7;
}

// AssetRef identifies an asset and names it for display.
message AssetRef {
  string library = 1;
  string asset_id = 2;
  // File name of the asset's original rendition; empty if unknown.
  string filename = 3;
}

// RenditionChanged: a rendition's size or hash changed in iCloud; its
// verification evidence was cleared.
message RenditionChanged {
  string version = 1;
  int64 size_bytes = 2;
  string sha256 = 3;
}

message StateChanged {
  AssetState from = 1;
  AssetState to = 2;
}

message Quarantined {
  string version = 1;
  Tier tier = 2;
  string reason = 3;
}

message QuarantineReleased {
  string reason = 1;
}

// RenditionMoved: the downloader now keeps a rendition at a different path; its
// verification evidence was cleared so the file at the new path is checked.
message RenditionMoved {
  string version = 1;
  string from = 2;
  string to = 3;
}

// IPhoneBackupChanged: a local backup folder changed state.
message IPhoneBackupChanged {
  string udid = 1;
  string device_name = 2;
  IPhoneBackupState from = 3;
  IPhoneBackupState to = 4;
  repeated string reasons = 5;
  // The backup folder: it identifies the backup (one device may have several).
  string dir = 6;
}

// DriveHealthChanged: the health of the storage holding the archive changed.
message DriveHealthChanged {
  HealthState from = 1;
  HealthState to = 2;
  repeated string reasons = 3;
}

enum AssetState {
  ASSET_STATE_UNSPECIFIED = 0;
  ASSET_STATE_DISCOVERED = 1;
  ASSET_STATE_DOWNLOADED = 2;
  ASSET_STATE_VERIFIED = 3;
  ASSET_STATE_QUARANTINED = 4;
}

enum Tier {
  TIER_UNSPECIFIED = 0;
  // Size and SHA-256 match the downloader's checksum.
  TIER_CONTENT = 1;
  // The MP4/MOV container's top-level boxes are complete.
  TIER_STRUCTURE = 2;
  // ffprobe can read the video's streams and duration.
  TIER_PROBE = 3;
}

message ListEventsRequest {
  // Kinds to include; at least one.
  repeated EventKind kinds = 1;
  // Maximum events to return, at most 200; 0 selects the default of 50.
  int32 page_size = 2;
  string page_token = 3;
}

message ListEventsResponse {
  repeated Event events = 1;
  string next_page_token = 2;
}

message ListAssetsRequest {
  // At most 200; 0 selects the default of 60.
  int32 page_size = 1;
  string page_token = 2;
  // Restricts the page to one kind; unspecified lists every kind.
  AssetKind kind = 3;
  // Lists the photos hidden in iCloud (archived under Photos/Hidden) instead
  // of the others.
  bool hidden = 4;
}

message ListAssetsResponse {
  repeated LibraryItem items = 1;
  string next_page_token = 2;
}

enum AssetKind {
  ASSET_KIND_UNSPECIFIED = 0;
  ASSET_KIND_PHOTO = 1;
  ASSET_KIND_LIVE_PHOTO = 2;
  ASSET_KIND_VIDEO = 3;
}

// LibraryItem is one asset in the library browser.
message LibraryItem {
  AssetRef asset = 1;
  AssetKind kind = 2;
  // When it was taken; absent when iCloud did not say.
  google.protobuf.Timestamp created_at = 3;
  AssetState state = 4;
  // Signed URLs of a 320 px square thumbnail and a preview that fits 1600 px,
  // both WebP, valid for at least 12 hours. All three fields are empty while
  // no displayable rendition is on disk yet (e.g. a Live Photo whose video
  // arrived before its picture).
  string thumbnail_url = 5;
  string preview_url = 6;
  // The rendition they show: the edited version when there is one.
  string display_version = 7;
}

message ListQuarantineRequest {}

message ListQuarantineResponse {
  repeated QuarantinedAsset assets = 1;
}

message QuarantinedAsset {
  AssetRef asset = 1;
  google.protobuf.Timestamp quarantined_at = 2;
  repeated Failure failures = 3;
}

// Failure is a rendition's recorded verification failure.
message Failure {
  string version = 1;
  Tier tier = 2;
  string reason = 3;
}

message GetAssetRequest {
  string library = 1;
  string asset_id = 2;
}

message GetAssetResponse {
  Asset asset = 1;
}

message Asset {
  AssetRef ref = 1;
  AssetState state = 2;
  google.protobuf.Timestamp state_changed_at = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp added_at = 5;
  google.protobuf.Timestamp last_seen_at = 6;
  repeated Rendition renditions = 7;
}

message Rendition {
  string version = 1;
  string filename = 2;
  string local_path = 3;
  MediaType media_type = 4;
  int64 size_bytes = 5;
  string sha256 = 6;
  // Tiers this rendition needs; content is always required.
  repeated Tier required_tiers = 7;
  // Tiers that passed, with when.
  repeated TierPass passes = 8;
  // Present while the rendition fails verification.
  Failure failure = 9;
}

message TierPass {
  Tier tier = 1;
  google.protobuf.Timestamp at = 2;
}

enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_PHOTO = 1;
  MEDIA_TYPE_VIDEO = 2;
  MEDIA_TYPE_LIVE_PHOTO_IMAGE = 3;
  MEDIA_TYPE_LIVE_PHOTO_VIDEO = 4;
}

message ReleaseQuarantineRequest {
  string library = 1;
  string asset_id = 2;
  // Why the operator judged the asset safe to re-verify; must not be blank.
  string reason = 3;
}

message ReleaseQuarantineResponse {}

message StartSyncRequest {}

message StartSyncResponse {
  // True when a cycle starts now, or right after the maintenance job that is
  // running. False when a cycle is already running or requested.
  bool started = 1;
}

message SendTestNotificationRequest {}

message SendTestNotificationResponse {}

message GetSettingsRequest {}

message GetSettingsResponse {
  Settings settings = 1;
}

// Settings mirrors the agent's validated configuration file.
message Settings {
  string config_path = 1;
  string storage_root = 2;
  string storage_archive_id = 3;
  double min_free_percent = 4;
  ToolPin downloader = 5;
  string downloader_config = 6;
  ToolPin video_probe = 7;
  string listen = 8;
  string notify_server = 9;
  string notify_topic = 10;
  // Seconds between scheduled cycles.
  int64 sync_interval_seconds = 11;
  int64 scrub_interval_seconds = 12;
  double scrub_fraction = 13;
  // The Apple Account kei signs in to.
  string apple_id = 14;
  // Whether photos hidden in iCloud are archived (under Photos/Hidden).
  bool include_hidden = 15;
  // The ffmpeg binary that renders thumbnails and previews.
  ToolPin thumbnailer = 16;
  // Where ledger snapshots are written, how often, and how many are kept.
  string backup_dir = 17;
  int64 backup_interval_seconds = 18;
  int32 backup_keep = 19;
  // The local iPhone backup directories homecloud watches (read only), the
  // oldest acceptable backup, how often they are checked, and the largest
  // acceptable size drop in percent.
  repeated string iphone_backup_dirs = 20;
  int64 iphone_backup_max_age_seconds = 21;
  int64 iphone_backup_check_interval_seconds = 22;
  double iphone_backup_max_shrink_percent = 23;
  // The iCloud Drive archive folder, how often it syncs, and how many files
  // download at once.
  string drive_dir = 24;
  int64 drive_sync_interval_seconds = 25;
  int32 drive_workers = 26;
  // The homecloud command-line tool installed next to the agent, for commands
  // the owner runs in a terminal (homecloud icloud login).
  string cli = 27;
  // How many copies of each device's iPhone backups the archive keeps (0:
  // none), and the folder another computer pushes backups to ("" if none).
  int32 iphone_backup_keep = 28;
  string iphone_backup_incoming = 29;
}

// ToolPin is an external tool and the exact version homecloud requires.
message ToolPin {
  string binary = 1;
  string version = 2;
}

message CreateLoginCodeRequest {}

message CreateLoginCodeResponse {
  // Eight characters from an unambiguous alphabet, shown as XXXX-XXXX.
  string code = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ExchangeLoginCodeRequest {
  string code = 1;
}

message ExchangeLoginCodeResponse {}

message PairDeviceRequest {
  string code = 1;
  // How the device is listed, e.g. the computer's name (1-64 characters).
  string name = 2;
}

message PairDeviceResponse {
  string device_id = 1;
  // The device's credential: shown once, stored by the agent only as a hash.
  string token = 2;
}

message ListDevicesRequest {}

message ListDevicesResponse {
  repeated PairedDevice devices = 1;
}

message PairedDevice {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp paired_at = 3;
  // To the minute.
  google.protobuf.Timestamp last_seen_at = 4;
}

message RevokeDeviceRequest {
  string device_id = 1;
}

message RevokeDeviceResponse {}
